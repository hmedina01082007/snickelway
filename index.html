<style>
/* Layout: one narrow study column under an enamel station sign; the Minster's rose window is the progress meter. */
:root {
  --stone: #E6EAE8; --paper: #F8FAF8; --ink: #17223B; --soft: #55607A; --line: #CCD3D4;
  --glass: #1D3F9A; --on-glass: #FFFFFF; --ruby: #AE1F3C; --amber: #B97400; --leaf: #1F7A58;
  --tint: #DFE6F6; --ok: #DCF0E6; --bad: #F8DEE3; --unlit: #D3DADB;
  --display: "Young Serif", Georgia, serif;
  --ui: "Cabin", "Gill Sans", "Segoe UI", sans-serif;
  --read: "Literata", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stone: #0E1424; --paper: #182036; --ink: #E9ECF4; --soft: #A3ADC4; --line: #303A55;
  --glass: #8FAAFF; --on-glass: #0E1424; --ruby: #FF8BA0; --amber: #F2B94C; --leaf: #63D0A6;
  --tint: #232E50; --ok: #173B30; --bad: #47202C; --unlit: #28314C; color-scheme: dark } }
:root[data-theme="dark"] {
  --stone: #0E1424; --paper: #182036; --ink: #E9ECF4; --soft: #A3ADC4; --line: #303A55;
  --glass: #8FAAFF; --on-glass: #0E1424; --ruby: #FF8BA0; --amber: #F2B94C; --leaf: #63D0A6;
  --tint: #232E50; --ok: #173B30; --bad: #47202C; --unlit: #28314C; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--stone); color: var(--ink); font: 400 16px/1.5 var(--ui); }
#wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 104px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance }
h1 { font-size: 30px } h2 { font-size: 23px } h3 { font-size: 18px }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--glass); outline-offset: 2px }
.sign { display: inline-block; background: var(--glass); color: var(--on-glass); padding: 4px; border-radius: 7px; }
.sign b { display: block; border: 1.5px solid var(--on-glass); border-radius: 4px; padding: 3px 12px; font: 700 15px/1.3 var(--ui); letter-spacing: .16em; text-transform: uppercase; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px }
nav#tabs { display: flex; gap: 4px }
nav#tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; font-weight: 600; color: var(--soft) }
nav#tabs button[aria-current="page"] { background: var(--tint); color: var(--ink) }
@media (max-width: 640px) {
  nav#tabs { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--line); justify-content: space-around;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  nav#tabs button { flex: 1; padding: 9px 2px }
}
.stack { display: grid; gap: 16px } .stack > * { min-width: 0 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }
.grow { flex: 1 1 180px; min-width: 0 }
.muted { color: var(--soft) } .small { font-size: 14px }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--soft) }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px }
.panel > * { min-width: 0 }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 9px 14px; font-weight: 600 }
.btn:hover { border-color: var(--glass) }
.btn.main { background: var(--glass); border-color: var(--glass); color: var(--on-glass) }
.btn.bad { color: var(--ruby) }
.btn:disabled { opacity: .55; cursor: default }
.link { border: 0; background: none; padding: 4px 0; color: var(--glass); font-weight: 600 }
input.f, select.f, textarea.f { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px }
label.l { display: grid; gap: 3px; font-size: 14px; font-weight: 600; color: var(--soft); min-width: 0 }
label.l .f { color: var(--ink); font-weight: 400; font-size: 16px }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px } .two > * { min-width: 0 }
.noai .ai { display: none !important }

/* hero */
.hero { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: center }
.hero > * { min-width: 0 }
.rose { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto }
.stats { display: flex; gap: 22px; flex-wrap: wrap }
.stats div b { display: block; font: 400 28px/1.1 var(--display); font-variant-numeric: tabular-nums }
.stats div span { font-size: 13px; color: var(--soft) }
@media (max-width: 520px) { .hero { grid-template-columns: 1fr } }

/* lists */
.list { display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.item { display: flex; gap: 12px; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px }
.item:first-child { border-top: 0 }
.item:hover { background: var(--tint) }
.item > span { min-width: 0 }
.ipa { font-family: "Segoe UI", "Noto Sans", "Lucida Sans Unicode", sans-serif; color: var(--glass) }
.term { font-weight: 600 } .pips { display: inline-flex; gap: 3px; flex: none }
.pips i { width: 7px; height: 7px; border-radius: 2px; background: var(--unlit); transform: rotate(45deg) }
.pips i.on { background: var(--amber) }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 11px; font-size: 14px; font-weight: 500 }
.chip[aria-pressed="true"] { background: var(--tint); border-color: var(--glass) }
.tag { font-size: 13px; color: var(--soft) }
.tag.syn b { color: var(--leaf) } .tag.ant b { color: var(--ruby) }

/* reading */
.article { font: 400 18px/1.68 var(--read); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px clamp(16px, 5vw, 34px); display: grid; gap: 16px }
.article p { max-width: 65ch; overflow-wrap: anywhere }
.w { cursor: pointer; border-radius: 3px } .w:hover { background: var(--tint) }
.w.saved { border-bottom: 2px dotted var(--amber) }
select.gap, input.gap { font: 500 15px var(--ui); background: var(--tint); border: 1px solid var(--glass); border-radius: 5px; padding: 1px 5px; max-width: 170px; }
input.gap { width: 10ch } select.gap { color: var(--ink) }
.gap.ok { background: var(--ok); border-color: var(--leaf) } .gap.no { background: var(--bad); border-color: var(--ruby) }
.num { font: 700 12px var(--ui); color: var(--soft); margin-right: 2px }
.base { font: 700 13px var(--ui); letter-spacing: .04em; color: var(--ruby); margin-left: 3px }
.fix { font: 600 15px var(--ui); color: var(--leaf); margin-left: 3px }
.q { display: grid; gap: 6px }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper) }
.opt.ok { background: var(--ok); border-color: var(--leaf) } .opt.no { background: var(--bad); border-color: var(--ruby) }
.notes { display: grid; gap: 7px; padding: 0; margin: 0; list-style: none; font-size: 15px }

/* cards */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 28px 20px; text-align: center; display: grid; gap: 12px; min-height: 260px; align-content: center }
.card .big { font: 400 clamp(28px, 7vw, 40px)/1.15 var(--display); overflow-wrap: anywhere }
.bar { height: 6px; background: var(--unlit); border-radius: 3px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--glass) }

/* games */
.game { display: grid; grid-template-columns: 44px 1fr; gap: 12px; text-align: left; align-items: center; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.game:hover { border-color: var(--glass) } .game > * { min-width: 0 }
.game svg { width: 44px; height: 44px }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.choices button { padding: 13px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; overflow-wrap: anywhere }
.choices button:hover:not(:disabled) { border-color: var(--glass) }
.choices button.ok, .pair.ok { background: var(--ok); border-color: var(--leaf) } .choices button.no, .pair.no { background: var(--bad); border-color: var(--ruby) }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px } .pairs > div { display: grid; gap: 8px; min-width: 0; align-content: start }
.pair { padding: 11px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-weight: 500; overflow-wrap: anywhere; min-height: 52px }
.pair.sel { border-color: var(--glass); background: var(--tint) } .pair:disabled { opacity: .6 }
.tiles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center }
.tile { width: 40px; height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font: 400 20px var(--display); text-transform: lowercase }
.tile:disabled { opacity: .25 }
.slot { min-height: 44px; font: 400 26px var(--display); letter-spacing: .08em; text-align: center; overflow-wrap: anywhere }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.shake { animation: shake .2s 2 }
@media (prefers-reduced-motion: reduce) { .shake { animation: none } }

/* sheet + toast */
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10, 15, 30, .45); display: flex; align-items: flex-end; justify-content: center }
#sheet > div { background: var(--paper); width: 100%; max-width: 600px; max-height: 88%; overflow-y: auto; border-radius: 14px 14px 0 0; display: grid; gap: 12px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet > div > * { min-width: 0 }
#toast { position: fixed; z-index: 30; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--stone); padding: 8px 14px; border-radius: 7px; font-weight: 500; max-width: 90%; }
</style>

at":"england","es":"sinceramente","example":"To be honest, I didn't enjoy the film.","ipa":"","kind":"expression","meaning":"used before giving your real opinion","note":"A menudo abreviado \"tbh\" por escrito.","played":0,"pos":"expression","synonyms":[],"term":"to be honest"},{"id":"p-tournament","antonyms":[],"cat":"sport","es":"torneo","example":"Wimbledon is the oldest tennis tournament in the world.","ipa":"/ˈtʊənəmənt/","kind":"word","meaning":"a competition with many matches","played":0,"pos":"noun","synonyms":["championship","competition"],"term":"tournament"},{"id":"p-tuition","antonyms":[],"cat":"uni","es":"matrícula, enseñanza","example":"Tuition is higher for international students.","ipa":"/tjuˈɪʃn/","kind":"word","meaning":"teaching, or the fees paid for it","played":0,"pos":"noun","synonyms":["teaching","instruction"],"term":"tuition"},{"id":"p-under-the-hood","antonyms":[],"cat":"it","es":"por dentro, a nivel interno","example":"Under the hood, the app is just a big spreadsheet.","ipa":"","kind":"expression","meaning":"in the internal workings of a system","note":"Muy usada entre programadores. En UK el coche tiene \"bonnet\", pero se dice igual \"under the hood\".","played":0,"pos":"expression","synonyms":["under the bonnet"],"term":"under the hood"},{"id":"p-underdog","antonyms":["favourite"],"cat":"sport","es":"el que no parte como favorito","example":"Everyone in England loves an underdog.","ipa":"/ˈʌndədɒɡ/","kind":"word","meaning":"the competitor expected to lose","played":0,"pos":"noun","synonyms":["outsider"],"term":"underdog"},{"id":"p-undergraduate","antonyms":["postgraduate"],"cat":"uni","es":"estudiante de grado","example":"Undergraduates can use the library all night.","ipa":"/ˌʌndəˈɡrædʒuət/","kind":"word","meaning":"a student taking a first degree","played":0,"pos":"noun","synonyms":["fresher (first year)"],"term":"undergraduate"},{"id":"p-versatile","antonyms":["limited","inflexible"],"cat":"it","es":"versátil","example":"Python is a remarkably versatile language.","ipa":"/ˈvɜːsətaɪl/","kind":"word","meaning":"able to do many different things","played":0,"pos":"adj","synonyms":["adaptable","flexible"],"term":"versatile"},{"id":"p-vulnerability","antonyms":["strength"],"cat":"it","es":"vulnerabilidad","example":"The audit found a serious vulnerability in the login form.","ipa":"/ˌvʌlnərəˈbɪləti/","kind":"word","meaning":"a weakness that can be attacked","played":0,"pos":"noun","synonyms":["weakness","flaw"],"term":"vulnerability"},{"id":"p-with-all-due-respect","antonyms":[],"cat":"england","es":"con todo el respeto","example":"With all due respect, that's not what the data shows.","ipa":"","kind":"expression","meaning":"a polite start, usually before disagreeing strongly","note":"Cuidado: suele anunciar un desacuerdo fuerte.","played":0,"pos":"expression","synonyms":[],"term":"with all due respect"},{"id":"p-you-alright","antonyms":[],"cat":"england","es":"¿qué tal?","example":"\"You alright?\" \"Yeah, not bad, you?\"","ipa":"","kind":"expression","meaning":"a casual greeting in England, not a real question","note":"Es un saludo. Responde \"yeah, you?\" y sigue andando.","played":0,"pos":"expression","synonyms":["alright?"],"term":"you alright?"},{"id":"p-you-re-alright","antonyms":[],"cat":"england","es":"no hace falta / no pasa nada","example":"\"Need a hand?\" \"You're alright, thanks.\"","ipa":"","kind":"expression","meaning":"a polite way of saying no thanks or no problem","note":"\"Do you want a bag?\" \"You're alright, thanks.\"","played":0,"pos":"expression","synonyms":[],"term":"you're alright"}],"articles":[{"id":"ai-pair","added":1,"body":"A few years ago, a junior developer learned the craft by getting stuck. You stared at a stack trace, searched for an answer, read a dozen unhelpful forum posts and finally, with some reluctance, asked a senior colleague. Today the same developer can describe the problem to an AI assistant and receive working code in seconds. The gain in speed is real, and it would be foolish to pretend otherwise. The harder question is what happens to the learning that used to take place along the way.\n\nWriting code was never the whole job. Much of a software engineer's value lies in deciding what to build, spotting the requirement nobody mentioned and knowing which risk is worth taking. Assistants are remarkably good at producing plausible solutions, but plausible is not the same as correct, and a confident mistake can be harder to catch than a hesitant one. The developer who cannot read the output critically is not so much collaborating as gambling.\n\nSensible students are therefore treating these tools as a demanding colleague rather than an oracle. They attempt a problem first, ask the assistant to review their work and then make it explain its reasoning. They write the tests themselves, because a test is a statement of what you believe should be true. Above all, they stay curious about the failures, which remain the most reliable teachers in the field.\n\nNobody knows exactly how the profession will look by the time today's first-years graduate. Yet the skills most likely to last are old-fashioned: clear thinking, clear writing and the patience to ask why. If anything, the arrival of a colleague who never sleeps makes those human habits more valuable, not less.","minutes":2,"source":"seed","title":"The Colleague Who Never Sleeps","topic":"Software"},{"id":"british-seminar","added":1,"body":"Nothing quite prepares an international student for the first seminar at a British university. You have done the reading, you have underlined half the chapter, and you take your seat fully expecting the tutor to explain what it all means. Instead, the tutor asks what you think, then waits. The silence that follows can feel endless.\n\nThis is not laziness. Small-group teaching rests on the assumption that understanding is built through discussion, and that a half-formed idea offered aloud is worth more than a perfect one kept to yourself. Nobody expects a polished lecture. In fact, the most useful contributions are often tentative ones, which is where the famous British habit of hedging becomes a genuine academic skill. Phrases such as \"I wonder whether\" or \"it could be argued that\" allow you to test a claim without staking your reputation on it.\n\nDisagreement works in a similar way. In some educational cultures, challenging a tutor would be disrespectful; here it is closer to a compliment. You are not, however, expected to contradict anybody bluntly. \"That's interesting, but I'm not sure it applies to...\" will do far more than \"No, that's wrong\", even though both mean more or less the same thing.\n\nIf speaking up still feels daunting, set yourself a small target: one contribution per session, prepared in advance if necessary. Asking a clarifying question counts. So does building on what a classmate has just said. By the middle of term, most students notice that the voice they were afraid of sounding foolish in has gradually become their own. Your accent, far from being a hindrance, will almost certainly be the least interesting thing about what you say.","minutes":2,"source":"seed","title":"Surviving the British Seminar","topic":"University"},{"id":"numbers-on-the-pitch","added":1793953000000,"body":"For most of its history, football ran on instinct. Scouts trusted their eyes, managers trusted their gut, and anyone who suggested consulting a spreadsheet would have been laughed out of the dressing room. Today, top clubs employ analysts with degrees in physics, and their work has quietly transformed the game.\n\nThe best-known invention is expected goals, or xG, a measure of how likely a given shot is to go in, based on thousands of similar attempts. It sounds dry, but its implications are striking. A team can lose a match while creating better chances, which means a poor result may be bad luck rather than bad football. Clubs such as Brentford have built their recruitment on data of this kind, finding bargains that wealthier rivals overlook.\n\nNot everyone is convinced. Critics argue that a model cannot capture leadership, nerve or the mood of a crowd, and they have a point. Data describes the past, and players are not machines. The smartest clubs therefore treat the numbers as an extra opinion in the room, rather than a verdict.\n\nFor a software student, the appeal is obvious: this is a domain where messy human behaviour meets clean code. And for the rest of us it offers a useful warning. Whenever a pundit claims that a team simply wanted it more, ask to see the evidence.","minutes":1,"source":"seed","title":"Numbers on the Pitch","topic":"Deportes"},{"id":"open-source-volunteers","added":1793953000000,"body":"Every time you book a train, stream a match or pay a bill, you depend on software written by people you will never meet, many of whom were never paid for it. This is the strange bargain at the heart of the modern internet: some of its most critical components are maintained by a handful of volunteers in their spare time.\n\nUsually the arrangement works remarkably well, which is why nobody thinks about it. Then something breaks. In 2016 a developer removed a tiny package of eleven lines from the npm registry, and builds failed around the world. Five years later, a flaw in Log4j, a logging library found almost everywhere, sent companies into a panic, while its unpaid maintainers worked through the weekends to fix it.\n\nThese incidents expose a question of responsibility. Huge corporations build fortunes on top of free code, yet contribute little in return. Some now fund foundations or pay staff to work on shared projects, but the support remains uneven.\n\nFor a student, there is an opportunity here. Contributing to an open-source project is one of the best ways of learning how real software is built. Start small: fix some documentation, reproduce a bug, write a test. You will have your code reviewed by experienced strangers, which can be humbling, and you will quietly become one of the people holding it all together.","minutes":1,"source":"seed","title":"Held Together by Volunteers","topic":"Informática"},{"id":"small-talk","added":1,"body":"\"Lovely weather we're having,\" says the person next to you at the bus stop, while rain trickles down your neck. You are not being asked for a forecast. You are being offered, in the only acceptable form available, a small act of friendliness.\n\nNewcomers to Britain often dismiss this kind of talk as empty. Linguists see it differently. The anthropologist Bronisław Malinowski called it \"phatic communion\": speech whose purpose is social rather than informational. When two neighbours agree that it's a bit chilly, no knowledge changes hands, but something important has happened all the same. Each has confirmed that the other is harmless, approachable and willing to play by the rules.\n\nThose rules are subtle, and much of the difficulty lies in decoding what people do not say. \"Not bad\" may be high praise. \"Interesting\" may be a polite way of saying terrible. \"We must have coffee sometime\" is generally not an invitation, and producing your diary at this point will cause mild alarm. Meanwhile, \"sorry\" can mean almost anything, including \"you have just stepped on my foot and I hold you personally responsible\".\n\nThe good news is that you do not need to master the whole system to take part. Three topics will get you through most encounters: the weather, your journey and whatever you are both queuing for. Keep your answers short, return the question, and resist the urge to give a truthful account of how you are. \"Not too bad, thanks, you?\" is a complete and satisfying conversation. Once you can manage it without thinking, you will find, to your slight dismay, that you have started doing it to other people.","minutes":2,"source":"seed","title":"The Quiet Art of Small Talk","topic":"British life"},{"id":"technical-debt","added":1,"body":"Every software engineer has done it. The deadline is looming, the demo is tomorrow, and the neat solution would take three days, so you hard-code a value, copy a function and promise yourself you will come back later. Ward Cunningham's famous metaphor for this is technical debt: you borrow speed today, and you repay it with interest every time the messy code slows somebody down.\n\nThe metaphor is useful precisely because it removes the moral panic. Debt is not inherently bad. A start-up that ships a clumsy prototype and learns that nobody wants the product has made an excellent bargain, since the code will be thrown away before the bill arrives. Trouble begins when the debt is taken on unknowingly, or when nobody keeps track of what is owed.\n\nTeams usually discover the problem indirectly. Estimates grow, simple changes break distant features, and new colleagues take months to become productive. Eventually someone proposes a full rewrite, which sounds heroic and is almost always a mistake. Rewrites tend to underestimate how much hard-won knowledge is buried in the ugly code, and the business rarely agrees to halt development while the work is done.\n\nA more modest strategy has proved sturdier. Good teams set aside a fixed share of each sprint for repayment, write tests around the parts they are wary of touching, and follow the old rule of leaving each file a little cleaner than they found it. None of this will make headlines. Neither will it win any awards at the end-of-year party. But in the long run, it is the difference between a codebase that people enjoy working on and one they quietly update their CVs to escape.","minutes":2,"source":"seed","title":"Borrowing from Your Future Self","topic":"Software"},{"id":"three-oclock","added":1793953000000,"body":"If you want to understand England, skip the museums and spend a wet Saturday afternoon at a lower-league football ground. The stadiums of the Premier League may attract tourists from every continent, yet the real ritual happens further down the pyramid, where a few thousand people gather to watch a team that will probably lose.\n\nPart of the appeal is tradition. English broadcasters are still barred from showing live matches during a slot on Saturday afternoons, a rule designed to protect attendance at smaller clubs. As a result, three o'clock retains an almost religious status. Fans queue for a pie, complain about the manager and debate tactics with people they have known since childhood.\n\nIn York, City play at a modern community stadium which they share with the rugby league side, the Knights, and supporters take a stubborn pride in their club however the season is going. Newcomers are usually welcomed, provided they don't claim to support someone famous instead.\n\nGoing along is an excellent way of improving your English. You will pick up slang, hear regional accents at full volume and discover that optimism is a form of madness. Above all, you will learn the most English lesson of all: that losing, if done together, is strangely comforting.","minutes":1,"source":"seed","title":"Saturday, Three O'Clock","topic":"Deportes"},{"id":"york-walls","added":1,"body":"Most visitors arrive in York expecting a museum, and for the first hour it is easy to see why. The Minster towers over the rooftops, the medieval walls encircle the old centre, and every second doorway seems to promise a ghost tour. Yet to treat the city as a preservation exercise alone would be to miss what makes it remarkable: York has been reinventing itself for nearly two thousand years.\n\nThe Romans founded it as Eboracum in AD 71, largely because the rivers Ouse and Foss made it easy to supply. The Vikings, who took the settlement in 866, renamed it Jorvik and turned it into a busy trading port, and their influence survives in street names ending in \"-gate\", from the Old Norse word for a street. Centuries later, George Hudson, a draper with boundless ambition, helped to make the city a hub of the railway age, while the Rowntree and Terry families built chocolate empires that employed thousands of local people.\n\nToday the economy leans heavily on universities, science and tourism, and the visitor who wanders into one of the narrow alleys known as snickelways may emerge beside a software company or a vegan café. The word itself is surprisingly recent: it was coined in the 1980s by a local author who walked and mapped these passages. That is rather typical of York. What looks timeless has often been invented by somebody with an eye for an opportunity, and nothing here has ever been truly finished.\n\nFor a newcomer, the lesson is reassuring. A city that has absorbed Romans, Vikings, railway speculators and generations of students will find room for one more stranger. You simply have to step off the main street and see where the alley leads.","minutes":2,"source":"seed","title":"The City Behind the Walls","topic":"York"}],"stats":{"best":{"match":29,"sprint":6},"days":{"2026-11-06":25},"done":{},"lastAuto":"2026-11-06"}}</script>

function rose() {
  const cx = 110, cy = 110, rings = [[20, 40, 8], [42, 60, 16], [62, 78, 16], [80, 94, 32], [96, 108, 32]];

      <div class="slot" id="slot">${typed.map(t => esc(t.c)).join('') || '&nbsp;'}</div>
      <div class="tiles">${tiles.map(t => `<button class="tile" data-a="tile" data-v="${t.k}"${typed.includes(t) ? ' disabled' : ''}>${esc(t.c)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn" data-a="undo">Borrar</button><button class="btn" data-a="hint"${hint ? ' disabled' : ''}>Pista en español</button><button class="btn" data-a="skip">Saltar</button></div></div>`
    };
    const advance = () => { i++; if (i >= base.length) finish('letters', score, false); else { load(); render() } };
    A.tile = el => {
      const t = tiles.find(x => x.k === +el.dataset.v); if (typed.includes(t)) return; typed.push(t); render();
      if (typed.length === tiles.length) {
        if (typed.map(x => x.c).join('') === base[i].term.toLowerCase()) { score += hint ? 1 : 2; toast('Correcto'); advance() }
        else { $('#slot').classList.add('shake'); setTimeout(() => { typed = []; render() }, 450) }
      }
    };
    A.undo = () => { typed.pop(); render() };
    A.hint = () => { hint = true; render() };
    A.skip = () => { toast(base[i].term); advance() };
    open(view, true);
  },
  phrases(deck) {
    const STOP = new Set(['the', 'a', 'an', 'to', 'of', 'in', 'on', 'at', 'it', "it's", 'that', 'be', 'you', 'your', 'something', 'with', 'than', 'more', 'can', "i'm", "i'll", 'not', 'could', 'for', 'is', 'my', 'all', 'one']);
    const keyOf = t => t.split(/\s+/).filter(x => !STOP.has(norm(x))).sort((a, b) => b.length - a.length)[0];
    const base = deck.filter(w => keyOf(w.term)).slice(0, 10);
    const keys = [...new Set([...S.words, ...S.pool].filter(w => FITS.phrases(w) && keyOf(w.term)).map(w => keyOf(w.term)))];
    if (base.length < 5 || keys.length < 6) return tooFew();
    let i = 0, score = 0, ans = null, opts = [];
    const load = () => { const k = keyOf(base[i].term); opts = shuffle([k, ...shuffle(keys.filter(x => norm(x) !== norm(k))).slice(0, 3)]); ans = null };
    load();
    const view = () => {
      const w = base[i], k = keyOf(w.term);
      return `<div class="stack"><div class="row between"><span class="term">${i + 1} de ${base.length} · ${score} puntos</span>${quit}</div>
      <div class="card" style="min-height:190px"><div class="big" style="font-size:clamp(23px,5.5vw,31px)">${esc(ans ? w.term : w.term.replace(k, '_____'))}</div><p class="muted">${esc(w.meaning)}</p>${ans ? `<p style="font-family:var(--read)"><i>${esc(w.example)}</i></p>` : ''}</div>
      <div class="choices">${opts.map(o => `<button data-a="phr" data-v="${esc(o)}"${ans ? ' disabled' : ''} class="${ans ? (o === k ? 'ok' : o === ans ? 'no' : '') : ''}">${esc(o)}</button>`).join('')}</div>
      ${ans ? `<button class="btn main" data-a="phrNext">${i + 1 < base.length ? 'Siguiente' : 'Ver resultado'}</button>` : ''}</div>`
    };
    A.phr = el => { ans = el.dataset.v; if (ans === keyOf(base[i].term)) score++; render() };
    A.phrNext = () => { i++; if (i >= base.length) finish('phrases', score, false); else { load(); render() } };
    open(view, true);
  }
};

/* ---------- actions ---------- */
function keepWord(id) { const p = S.pool.find(w => w.id === id); if (!p) return; addToVocab(p); LS.set('words', S.words); LS.set('pool', S.pool); touch(); saveStats(); toast('Guardada en tu vocabulario') }
const A = {
  tab: el => { closeSheet(); goTab(el.dataset.v); try { location.hash = el.dataset.v } catch { } },
  close: closeSheet,
  newWord: () => wordForm(),
  word: el => showWord(el.dataset.v),
  edit: el => wordForm(S.words.find(w => w.id === el.dataset.v)),
  speak: el => speak(el.dataset.v, +el.dataset.r || .95),
  play: el => playWord(el.dataset.v),
  gemOn: el => { const k = $('#gkey').value.trim(); if (!k) { toast('Pega primero tu clave.'); return } LS.set('gkey', k); LS.set('gmodel', ''); run(el, async () => { try { await gemModel(); toast('Gemini conectado'); render() } catch (e) { LS.set('gkey', ''); toast(e?.gem ? 'Gemini no acepta esa clave. Revísala.' : NET_ERR) } }) },
  gemOff: () => { LS.set('gkey', ''); LS.set('gmodel', ''); render(); toast('Clave quitada') },
  tmpKeep: () => { const w = ui.tmp; put('words', { ...w, id: newId('w'), box: 0, due: 0, added: Date.now() }); touch(); saveStats(); closeSheet(); toast('Guardada en tu vocabulario'); refresh(); markSaved() },
  tmpForm: () => wordForm(ui.tmp),
  backup: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ words: S.words, articles: S.articles, pool: S.pool, stats: S.stats })], { type: 'application/json' })); a.download = `snickelway-${dayKey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000) },
  keep: el => { keepWord(el.dataset.v); closeSheet(); render() },
  filter: el => { ui.filter = el.dataset.v; render() },
  src: el => { ui.src = el.dataset.v; LS.set('src', ui.src); render() },
  cat: el => { ui.cat = el.dataset.v; LS.set('cat', ui.cat); render() },
  delAsk: el => { el.textContent = '¿Seguro? Toca para borrar'; el.dataset.a = 'del' },
  del: el => { remove('words', el.dataset.v); closeSheet(); toast('Borrada'); refresh() },
  delArtAsk: el => { el.textContent = '¿Seguro? Toca para borrar'; el.dataset.a = 'delArt' },
  delArt: el => { remove('articles', el.dataset.v); goTab('reading'); toast('Artículo borrado') },
  review: startReview,
  art: el => showArticle(el.dataset.v),
  ex: el => showExercise(el.dataset.v, el.dataset.e),
  game: el => startGame(el.dataset.v),
  tap: el => {
    const raw = el.textContent, ctx = el.closest('p, li')?.textContent || '';
    const sent = sentencesOf(ctx).find(x => x.includes(raw))?.trim() || '';
    lookup(raw, /\{\d+\}|[0-9]…/.test(sent) ? '' : sent);
  },
  fill: el => {
    const term = $('#f-term').value.trim(); if (!term) { toast('Escribe primero la palabra.'); return }
    run(el, async () => {
      const r = term.includes(' ') ? await idiomEntry(term) : await dictEntry(term);
      if (!r || !$('#f-term')) { toast('No aparece en el diccionario. Puedes rellenarla a mano.'); return }
      const expr = r.kind === 'expression';
      $('#f-term').value = r.term; $('#f-kind').value = expr ? 'expression' : 'word'; $('#f-pos').value = r.pos || ''; $('#f-ipa').value = r.ipa || ''; $('#f-meaning').value = r.meaning; $('#f-es').value = r.es || '';
      $('#f-syn').value = r.synonyms.join(', '); $('#f-ant').value = expr ? '' : r.antonyms.join(', '); if (r.example && !$('#f-ex').value) $('#f-ex').value = r.example;
      syncKind();
    });
  },
  suggest: () => sheet(`<form id="sf" class="stack"><h2>Traer palabras nuevas</h2>
    <label class="l">Tema<select class="f" id="s-cat">${Object.entries(CATS).map(([k, l]) => `<option value="${k}"${k === ui.cat ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="l">Qué quieres<select class="f" id="s-kind"><option value="">Palabras y expresiones</option><option value="expression">Solo expresiones</option><option value="word">Solo palabras</option></select></label>
    <div class="row"><button class="btn main" type="submit" id="s-go">Traer 10</button><button class="btn" type="button" data-a="close">Cerrar</button></div></form>`),
  surprise: el => run(el, async () => { const a = await writeArticle(el.dataset.v); showArticle(a.id) }),
  newArticle: el => {
    const topic = $('#topic').value.trim(); if (!topic) { toast('Escribe un tema primero.'); return }
    run(el, async () => { const a = await writeArticle(topic, true); showArticle(a.id) });
  },
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') return closeSheet();
  const el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) A[el.dataset.a](el);
});
document.addEventListener('input', e => { if (e.target.id === 'search') { ui.q = e.target.value; $('#rows').innerHTML = wordRows() } });
function markSaved() { $$('.w').forEach(w => { const k = new Set(S.words.filter(x => x.kind === 'word').map(x => norm(x.term))); if (stems(w.textContent).some(s => k.has(s))) w.classList.add('saved') }) }
document.addEventListener('change', e => {
  if (e.target.id === 'restore' && e.target.files[0]) {
    const f = new FileReader(); f.onload = () => {
      try { const d = JSON.parse(f.result); if (!Array.isArray(d.words) || !Array.isArray(d.articles)) throw 0; ['words', 'articles', 'pool'].forEach(c => { S[c] = d[c] || []; LS.set(c, S[c]) }); S.stats = { days: {}, best: {}, done: {}, ...d.stats }; saveStats(); render(); toast('Copia restaurada') }
      catch { toast('Ese archivo no es una copia de Snickelway.') }
    }; f.readAsText(e.target.files[0]);
  }
  if (e.target.id === 'f-kind') syncKind();
  if (e.target.id === 'voice') { LS.set('voice', e.target.value); speak('Hello, nice to meet you.') }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'wf') saveWord(e.target);
  if (e.target.id === 'sf') {
    const cat = $('#s-cat').value, kind = $('#s-kind').value || null;
    run($('#s-go'), async () => { const n = await fetchPool(cat, kind, 10); closeSheet(); toast(n + ' nuevas en Descubrir'); ui.filter = 'discover'; render() });
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet() });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (VIEWS[t] && (t !== ui.tab || ui.view)) goTab(t) });
{ const t = location.hash.slice(1); if (VIEWS[t]) ui.tab = t }
boot();
</script>
